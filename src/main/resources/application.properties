spring.application.name=dwese2627-bookinder-webapp-sergioruiz

# Datos de conexión a la base de datos (se leen del fichero .env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
# Indica cual es el fichero de las variables de entorno
spring.config.import=optional:file:.env[.properties]

# Las tablas las crea schema.sql y los datos data.sql (Hibernate no toca las tablas)
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.messages.encoding=UTF-8

# Muestra las consultas SQL generadas en la consola
spring.jpa.show-sql=true

# Formatea las consultas SQL para que sean más legibles en la consola
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico de Hibernate para MariaDB (es compatible con MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Configuración de los logs del datasource
logging.level.org.springframework.jdbc.datasource.DataSourceTransactionManager=DEBUG

# Número máximo de conexiones que puede abrir el pool de conexiones
spring.datasource.hikari.maximum-pool-size=10

# ===== Subida de imágenes (portadas de los libros) =====
# Ruta raíz donde se guardan los ficheros subidos (fuera del jar).
# Se lee de la variable APP_UPLOAD_PATH del .env; si no existe se usa ./bookinder-images
app.upload-root=${APP_UPLOAD_PATH:./bookinder-images}

# Spring Boot servirá recursos estáticos desde:
# - classpath:/static/   (css, js, imágenes del proyecto)
# - file:${app.upload-root}/   (carpeta externa con las portadas)
spring.web.resources.static-locations=classpath:/static/,file:${app.upload-root}/

# Tamaño máximo de subida que acepta Spring. El límite real de 2 MB
# para la portada se comprueba en LibroServiceImpl.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
