<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Bookinder - Inicio')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="position-relative bg-light" style="height: 100vh;">
    <div class="position-absolute top-50 start-50 translate-middle text-center">
        <h1 class="display-4 fw-bold" th:text="#{msg.title}">Bookinder</h1>
        <p class="lead text-muted">
            <strong>Sergio Ruiz Ortiz</strong> - <span th:text="#{msg.index.description}"></span>
        </p>
        <a th:href="@{/libros}" class="btn btn-primary me-2" th:text="#{msg.header.libros}"></a>
        <a th:href="@{/categorias}" class="btn btn-outline-primary" th:text="#{msg.header.categorias}"></a>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
