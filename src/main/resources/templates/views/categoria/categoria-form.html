<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Bookinder - Categoría')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título dinámico (alta / edición) -->
        <h1 th:text="${categoria.id} == null ? #{msg.categoria-form.add} : #{msg.categoria-form.edit}"></h1>

        <!-- Mensaje de error global -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Formulario: si no hay id es un alta, si hay id es una edición -->
        <form th:action="${categoria.id} == null ? @{/categorias/insert} : @{/categorias/update}"
              th:object="${categoria}" method="post" class="mt-3">

            <input type="hidden" th:field="*{id}"/>

            <!-- Nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label" th:text="#{msg.categoria-form.nombre}"></label>
                <input type="text" id="nombre" th:field="*{nombre}" class="form-control" maxlength="100"/>
                <div th:if="${#fields.hasErrors('nombre')}" class="text-danger" th:errors="*{nombre}"></div>
            </div>

            <!-- Botón submit dinámico -->
            <button type="submit" class="btn btn-primary"
                    th:text="${categoria.id} == null ? #{msg.categoria-form.create} : #{msg.categoria-form.update}"></button>

            <!-- Volver al listado -->
            <a th:href="@{/categorias}" class="btn btn-secondary" th:text="#{msg.categoria-form.returnback}"></a>
        </form>

    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
