<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Bookinder - Categoría')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle de la categoría: {nombre} -->
        <h1>
            <span th:text="#{msg.categoria-detail.title}"></span>:
            <span th:text="${categoria.nombre}"></span>
        </h1>

        <!-- Datos básicos de la categoría -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.categoria-detail.section.categoriaData}"></h2>
            <dl class="row">
                <dt class="col-sm-3" th:text="#{msg.categoria-detail.field.id}"></dt>
                <dd class="col-sm-9" th:text="${categoria.id}"></dd>

                <dt class="col-sm-3" th:text="#{msg.categoria-detail.field.nombre}"></dt>
                <dd class="col-sm-9" th:text="${categoria.nombre}"></dd>
            </dl>
        </div>

        <!-- Libros de la categoría -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.categoria-detail.section.libros}"></h2>

            <!-- Si no tiene libros -->
            <div class="alert alert-info" th:if="${#lists.isEmpty(categoria.libros)}"
                 th:text="#{msg.categoria-detail.libros.empty}"></div>

            <!-- Tabla de libros -->
            <div th:if="${!#lists.isEmpty(categoria.libros)}" class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{msg.categoria-detail.libros.col.id}"></th>
                        <th scope="col" th:text="#{msg.categoria-detail.libros.col.isbn}"></th>
                        <th scope="col" th:text="#{msg.categoria-detail.libros.col.titulo}"></th>
                        <th scope="col" th:text="#{msg.categoria-detail.libros.col.autor}"></th>
                        <th scope="col" class="text-end" th:text="#{msg.categoria-detail.libros.col.actions}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="libro : ${categoria.libros}">
                        <td th:text="${libro.id}"></td>
                        <td th:text="${libro.isbn}"></td>
                        <td th:text="${libro.titulo}"></td>
                        <td th:text="${libro.autor}"></td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary"
                               th:href="@{/libros/detail(id=${libro.id})}"
                               th:text="#{msg.categoria-detail.viewDetail}"></a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Volver -->
        <div class="mt-4">
            <a class="btn btn-secondary" th:href="@{/categorias}" th:text="#{msg.categoria-detail.action.back}"></a>
        </div>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
