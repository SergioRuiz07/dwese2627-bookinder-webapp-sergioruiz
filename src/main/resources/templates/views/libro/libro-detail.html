<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/head :: head ('Bookinder - Libro')"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="form-page">
    <div class="form-card">

        <!-- Título: Detalle del libro: {título} -->
        <h1>
            <span th:text="#{msg.libro-detail.title}"></span>:
            <span th:text="${libro.titulo}"></span>
        </h1>

        <!-- Mensaje de error -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <!-- Datos del libro -->
        <div class="mt-3">
            <h2 class="h5" th:text="#{msg.libro-detail.section.libroData}"></h2>
            <dl class="row">
                <!-- Portada del libro -->
                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.portada}"></dt>
                <dd class="col-sm-9">
                    <div th:if="${libro.urlPortada == null}">
                        <span class="text-muted" th:text="#{msg.libro-detail.noImage}"></span>
                    </div>
                    <div th:if="${libro.urlPortada != null}">
                        <img th:src="@{${libro.urlPortada}}" alt="Portada" class="img-thumbnail rounded"
                             style="max-width: 150px;"/>
                    </div>
                </dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.id}"></dt>
                <dd class="col-sm-9" th:text="${libro.id} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.isbn}"></dt>
                <dd class="col-sm-9" th:text="${libro.isbn} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.titulo}"></dt>
                <dd class="col-sm-9" th:text="${libro.titulo} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.autor}"></dt>
                <dd class="col-sm-9" th:text="${libro.autor} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.editorial}"></dt>
                <dd class="col-sm-9" th:text="${libro.editorial} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.anioPublicacion}"></dt>
                <dd class="col-sm-9" th:text="${libro.anioPublicacion} ?: '-'"></dd>

                <dt class="col-sm-3" th:text="#{msg.libro-detail.field.sinopsis}"></dt>
                <dd class="col-sm-9" th:text="${libro.sinopsis} ?: '-'"></dd>

            </dl>
        </div>

        <!-- Categoría del libro (una sola) -->
        <div class="mt-4">
            <h2 class="h5" th:text="#{msg.libro-detail.section.categoria}"></h2>

            <div th:if="${libro.categoria == null}" class="alert alert-info"
                 th:text="#{msg.libro-detail.categoria.empty}"></div>

            <div th:if="${libro.categoria != null}">
                <dl class="row">
                    <dt class="col-sm-3" th:text="#{msg.libro-detail.categoria.field.id}"></dt>
                    <dd class="col-sm-9" th:text="${libro.categoria.id}"></dd>

                    <dt class="col-sm-3" th:text="#{msg.libro-detail.categoria.field.nombre}"></dt>
                    <dd class="col-sm-9" th:text="${libro.categoria.nombre}"></dd>
                </dl>

                <!-- Ver detalle de la categoría -->
                <a class="btn btn-sm btn-outline-primary me-2"
                   th:href="@{/categorias/detail(id=${libro.categoria.id})}"
                   th:text="#{msg.libro-detail.categoria.viewDetail}"></a>
            </div>
        </div>

        <!-- Volver -->
        <div class="mt-4">
            <a class="btn btn-secondary" th:href="@{/libros}" th:text="#{msg.libro-detail.action.back}"></a>
        </div>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
